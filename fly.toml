app = "ai-agent-engineering-guide"
primary_region = "nrt"

[env]
  PROGRESS_DB_PATH = "/data/progress.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "progress_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
